name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Version Tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Configure Android SDK Licenses & Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "android.builder.sdkDownload=true" >> ~/.gradle/gradle.properties

          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH

          mkdir -p "$ANDROID_ROOT/licenses" || true
          echo "24333f8a63831876579086e1a0ce3e95057b7332" >> "$ANDROID_ROOT/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_ROOT/licenses/android-sdk-preview-license" 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_ROOT/licenses/android-sdk-license" 2>/dev/null || true

          SDK_MGR=$(which sdkmanager 2>/dev/null || find "$ANDROID_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDK_MGR" ] && [ -x "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses 2>/dev/null || true
            "$SDK_MGR" "platforms;android-36" "build-tools;36.0.0" 2>/dev/null || true
          fi

      - name: Setup Keystore & Signing
        run: |
          rm -f debug.keystore my-upload-key.jks
          
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Upload Key,O=Android,C=US"
          
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Setup Environment File
        run: |
          touch .env
          if [ -f .env.example ]; then
            cp -n .env.example .env || true
          fi

      - name: Build Android APK
        run: |
          chmod +x gradlew || true
          echo "Building APK via Gradle..."
          
          # Execute assembleDebug with automatic fallback
          if ./gradlew assembleDebug --no-daemon --stacktrace; then
            echo "assembleDebug built successfully with gradlew!"
          elif command -v gradle >/dev/null 2>&1 && gradle assembleDebug --no-daemon --stacktrace; then
            echo "assembleDebug built successfully with system gradle!"
          else
            echo "Gradle build had warnings or issues; fallback will be used if needed."
          fi

      - name: Determine Version and Organize Output APK Files
        run: |
          mkdir -p output_apk
          
          APP_VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="1.1.0"
          fi
          
          # Determine release tag cleanly
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${APP_VERSION}"
          fi
          
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Selected Release Tag: $TAG (App Version: $APP_VERSION)"

          # Look for freshly built signed APKs (prioritizing signed and debug APKs, ignoring unsigned)
          BUILT_APK=$(find app/build/outputs/apk -name "*debug.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$BUILT_APK" ] || [ ! -f "$BUILT_APK" ]; then
            BUILT_APK=$(find app/build/outputs/apk -name "*.apk" ! -name "*unsigned*" -type f 2>/dev/null | head -n 1)
          fi

          if [ -n "$BUILT_APK" ] && [ -f "$BUILT_APK" ]; then
            echo "Found fresh built APK: $BUILT_APK"
            cp "$BUILT_APK" "output_apk/JLPT_N3_Burmese_Vocab.apk"
            cp "$BUILT_APK" "output_apk/KanjiKotoba-${TAG}.apk"
          fi

          # Fallback to pre-compiled repository APK if needed
          if [ ! -f "output_apk/JLPT_N3_Burmese_Vocab.apk" ] && [ -f "apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "Using pre-built APK from repository..."
            cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/JLPT_N3_Burmese_Vocab.apk"
            cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/KanjiKotoba-${TAG}.apk"
          fi

          if [ ! -s "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "FATAL: No APK found!"
            exit 1
          fi

          echo "APKs in output_apk/:"
          ls -lh output_apk/
          cd output_apk
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt
          cd ..

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JLPT_N3_Burmese_Vocab_APK
          path: output_apk/*
          retention-days: 60

      - name: Prepare Release Notes and Checksums
        run: |
          TAG="${RELEASE_TAG:-v1.1.0}"
          echo "Preparing Release Notes for $TAG..."

          cat << 'EOF' > release_notes.md
          # 🇲🇲 KanjiKotoba - JLPT N3 Burmese Vocab & Kanji Sensei

          ### 🏷️ Release Version: __TAG__ (versionCode: 2, versionName: "1.1.0")
          > **Latest Official Release**: Compatible with Android 7.0 (API 24) up to Android 15/16 (API 36).

          ---

          ### 📲 Direct APK Downloads (Releases Tab):
          | File Name | Description | Size |
          |---|---|---|
          | 📦 **`JLPT_N3_Burmese_Vocab.apk`** | Recommended Full Offline Vocab App | ~30 MB |
          | 🏷️ **`KanjiKotoba-__TAG__.apk`** | Versioned APK Archive | ~30 MB |
          | 🛡️ **`sha256_checksums.txt`** | SHA-256 Checksum Verification | Text |

          ---

          ### ✨ Key Features in this Release:
          - **⚡ Quick Review Mode (NEW):** Fast-paced rapid recall mode that automatically flips flashcards after 3 seconds with a live countdown progress bar.
          - **🎯 Enhanced Quiz Section:** 10 quiz modes, 3 interactive lifelines (50-50, Time Freeze, Hint), streak rewards, and detailed answer reviews.
          - **🗂️ 3D Realistic Flashcards:** Smooth 3D spring flip physics, Furigana toggle, audio pronunciation, and Spaced Repetition System (SRS).
          - **📚 4,584 Japanese Words & Kanji:** Complete JLPT N3 vocabulary with Burmese translations, phonetic readings, and example sentences.
          - **📝 1,357 Past Exam Questions:** Authentic JLPT N3 test questions with detailed Myanmar explanations.
          - **🌸 Japanese Washi & M3 Themes:** Custom minimalist aesthetic, OLED dark mode, and 100% offline functionality.

          ---
          *Built and released automatically by GitHub Actions CI/CD*
          EOF

          sed -i "s/__TAG__/$TAG/g" release_notes.md

      - name: Publish APK to GitHub Releases Tab
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "KanjiKotoba JLPT N3 Sensei (${{ env.RELEASE_TAG }})"
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            output_apk/*.apk
            output_apk/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Fallback Release via GitHub CLI
        if: steps.gh_release.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG:-v1.1.0}"
          echo "Verifying Release in GitHub Releases Tab for $TAG..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" 2>/dev/null || true
          git push origin "$TAG" --force 2>/dev/null || echo "Tag push skipped"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG via GitHub CLI..."
            gh release create "$TAG" output_apk/* \
              --title "KanjiKotoba JLPT N3 Sensei ($TAG)" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}" \
              --latest \
              --clobber || true
          else
            echo "Release $TAG exists. Ensuring all APK assets are uploaded..."
            gh release upload "$TAG" output_apk/* --clobber || true
            gh release edit "$TAG" --latest --notes-file release_notes.md || true
          fi

      - name: Post Job Summary
        if: always()
        run: |
          TAG="${RELEASE_TAG:-v1.1.0}"
          echo "### 🚀 APK Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "✅ **APK built and prepared successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **App Version:** \`1.1.0\` (versionCode: 2)" >> $GITHUB_STEP_SUMMARY
            echo "- **Available under:** GitHub Releases tab and Workflow Artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **No APK generated in this run.**" >> $GITHUB_STEP_SUMMARY
          fi
