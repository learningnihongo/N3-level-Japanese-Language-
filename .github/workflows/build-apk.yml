name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Name (e.g. v1.2.0, or leave blank to auto-tag)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release Title (leave blank for auto-generated title)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: true
      is_draft:
        description: 'Create as Draft Release'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Configure Gradle JVM Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63831876579086e1a0ce3e95057b7332" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

      - name: Setup Keystore & Signing Keys
        run: |
          rm -f debug.keystore my-upload-key.jks
          
          # Generate valid debug.keystore for debugConfig
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Generate valid my-upload-key.jks with alias 'upload' for release config
          echo "Generating my-upload-key.jks..."
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Upload Key,O=Android,C=US"

          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Prepare Secrets & Environment Configuration
        run: |
          touch .env
          if [ -f .env.example ]; then
            cp -n .env.example .env || true
          fi

      - name: Determine Version and Tag
        id: versioning
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_RELEASE_TITLE: ${{ github.event.inputs.release_title }}
          INPUT_CREATE_RELEASE: ${{ github.event.inputs.create_release }}
        run: |
          BASE_VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.0"
          fi
          echo "Base Version: $BASE_VERSION"

          SHOULD_RELEASE="true"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_RELEASE_TAG" ]; then
            TAG_NAME="$INPUT_RELEASE_TAG"
            if [ "$INPUT_CREATE_RELEASE" = "false" ]; then
              SHOULD_RELEASE="false"
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            TAG_NAME="v${BASE_VERSION}.${{ github.run_number }}"
          else
            TAG_NAME="v${BASE_VERSION}-run${{ github.run_number }}"
            SHOULD_RELEASE="false"
          fi

          if [ -n "$INPUT_RELEASE_TITLE" ]; then
            RELEASE_TITLE="$INPUT_RELEASE_TITLE"
          else
            RELEASE_TITLE="KanjiKotoba JLPT N3 Sensei ${TAG_NAME}"
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> $GITHUB_ENV
          echo "Tag: $TAG_NAME | Should Release: $SHOULD_RELEASE"

      - name: Build Android APK
        run: |
          chmod +x gradlew || true
          echo "Starting Gradle build..."
          
          # Build assembleDebug first (guaranteed reliable signing with debug.keystore)
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          
          # Try assembleRelease as well
          ./gradlew assembleRelease --no-daemon --stacktrace || gradle assembleRelease --no-daemon --stacktrace || echo "assembleRelease failed, using assembleDebug"

      - name: Organize Output APK Files
        id: organize_apks
        run: |
          mkdir -p output_apk

          # Find produced APKs
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | head -n 1)

          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
            cp "$RELEASE_APK" "output_apk/JLPT_N3_Burmese_Vocab.apk"
          fi

          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" "output_apk/KanjiKotoba-${TAG_NAME}-debug.apk"
            if [ ! -f "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
              cp "$DEBUG_APK" "output_apk/JLPT_N3_Burmese_Vocab.apk"
              cp "$DEBUG_APK" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
            fi
          fi

          # Fallback to repo APK if build output was empty
          if [ ! -f "output_apk/JLPT_N3_Burmese_Vocab.apk" ] && [ -f "apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "Using repository pre-built APK..."
            cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/JLPT_N3_Burmese_Vocab.apk"
            cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
          fi

          echo "APKs in output_apk/:"
          ls -lh output_apk/

          if [ ! -s "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "Error: No APK found!"
            exit 1
          fi

          # Generate SHA256 Checksums
          cd output_apk
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt
          cd ..

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KanjiKotoba-APKs-${{ env.TAG_NAME }}
          path: output_apk/*
          retention-days: 60
          if-no-files-found: error

      - name: Create Git Tag & Publish GitHub Release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IS_DRAFT: ${{ github.event.inputs.is_draft }}
          INPUT_IS_PRERELEASE: ${{ github.event.inputs.is_prerelease }}
        run: |
          echo "Setting up Git author identity..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Tag commit in Git
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating tag $TAG_NAME..."
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" || echo "Tag push returned $?, continuing..."
          fi

          # Generate release notes
          cat << 'EOF' > release_notes.md
## 🇯🇵 JLPT N3 Burmese Vocab & Kanji Sensei (KanjiKotoba)

**Release Version:** `${{ env.TAG_NAME }}`
**Commit:** `${{ github.sha }}`

---

### 📲 Downloads (တိုက်ရိုက်ဒေါင်းလုဒ်ရယူရန်)
* **⭐ အကြံပြုထားသော APK (Direct Install):** `JLPT_N3_Burmese_Vocab.apk`
* **Release APK:** `KanjiKotoba-${{ env.TAG_NAME }}-release.apk`
* **Debug APK:** `KanjiKotoba-${{ env.TAG_NAME }}-debug.apk`
* **Checksums:** `sha256_checksums.txt`

---

### ✨ အဓိက ပါဝင်သော အချက်များ (Key Features)
* **ဝေါဟာရ ၄,၅၈၄ ခု အပြည့်အစုံ:** JLPT N3 စာမေးပွဲအတွက် လိုအပ်သော Kanji, Kotoba, အဓိပ္ပာယ် နှင့် အသံထွက် ၄,၅၈၄ ခု အားလုံး ပါဝင်ပါသည်။
* **စစ်မှန်သော မေးခွန်းဟောင်းများ (2014-2025):** ၁,၃၅၇ ခုသော မေးခွန်းဟောင်းများကို မြန်မာဘာသာပြန်နှင့်တကွ လေ့ကျင့်နိုင်ပါသည်။
* **3D Flashcards & Interactive Gestures:** Flip, Swipe, နှင့် Smooth Carousel အမူအရာများဖြင့် လေ့လာနိုင်ပါသည်။
* **Daily Quiz & Streak Tracking:** နေ့စဉ် Quiz လေ့ကျင့်မှုနှင့် Streak စနစ် ပါဝင်ပါသည်။
* **Google Sign-In & Cloud Sync:** Firebase Authentication ဖြင့် လေ့လာမှုမှတ်တမ်းများကို Cloud Backup ပြုလုပ်နိုင်ပါသည်။
* **100% Offline Ready:** အင်တာနက်မလိုဘဲ ဖုန်းထဲတွင် တိုက်ရိုက် လေ့လာမှတ်သားနိုင်ပါသည်။
EOF

          DRAFT_OPT=""
          if [ "$INPUT_IS_DRAFT" = "true" ]; then
            DRAFT_OPT="--draft"
          fi

          PRERELEASE_OPT=""
          if [ "$INPUT_IS_PRERELEASE" = "true" ]; then
            PRERELEASE_OPT="--prerelease"
          fi

          echo "Publishing Release via GitHub CLI..."
          gh release create "$TAG_NAME" output_apk/* \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            $DRAFT_OPT $PRERELEASE_OPT \
            --clobber || {
              echo "Release create failed or already exists. Attempting file upload..."
              gh release upload "$TAG_NAME" output_apk/* --clobber || echo "Notice: Release could not be created via API. If you see HTTP 403, please enable 'Read and write permissions' in repository Settings > Actions > General > Workflow permissions."
            }

      - name: Build Summary Output
        run: |
          echo "## 🚀 Build & Release Successful!" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: \`${{ env.TAG_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "### Generated APKs:" >> $GITHUB_STEP_SUMMARY
          ls -lh output_apk/*.apk | awk '{print "- **" $9 "** (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
