name: Build and Release Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '[0-9]+.*'
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Name (e.g. v1.2.0, or leave blank to auto-tag)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release Title (leave blank for default)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: true
      is_draft:
        description: 'Create as Draft Release'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Keystore
        run: |
          # 1. Clean existing keystore to avoid corruption
          rm -f debug.keystore
          # 2. Decode from base64 if present (stripping CR/LF/spaces)
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || true
          fi
          # 3. Generate fresh valid debug keystore if missing or 0 bytes
          if [ ! -s debug.keystore ]; then
            echo "Generating clean debug.keystore with keytool..."
            rm -f debug.keystore
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          cp -f debug.keystore my-upload-key.jks 2>/dev/null || true
          ls -la debug.keystore
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/debug.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Prepare Secrets & Environment Files
        run: |
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Determine Version and Tag
        id: determine_version
        run: |
          BASE_VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.0"
          fi
          echo "Base Version: $BASE_VERSION"

          SHOULD_RELEASE="false"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            SHOULD_RELEASE="true"
            echo "Event: Tag Push -> $TAG_NAME"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [ -n "${{ inputs.release_tag }}" ]; then
              TAG_NAME="${{ inputs.release_tag }}"
            else
              TAG_NAME="v${BASE_VERSION}.${{ github.run_number }}"
            fi
            if [ "${{ inputs.create_release }}" == "true" ]; then
              SHOULD_RELEASE="true"
            fi
            echo "Event: Workflow Dispatch -> $TAG_NAME"
          elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            TAG_NAME="v${BASE_VERSION}.${{ github.run_number }}"
            SHOULD_RELEASE="true"
            echo "Event: Push to main/master -> $TAG_NAME"
          else
            TAG_NAME="v${BASE_VERSION}-dev.${{ github.run_number }}"
            SHOULD_RELEASE="false"
            echo "Event: Branch push -> $TAG_NAME"
          fi

          if [ -n "${{ inputs.release_title }}" ]; then
            RELEASE_TITLE="${{ inputs.release_title }}"
          else
            RELEASE_TITLE="KanjiKotoba JLPT N3 Sensei ${TAG_NAME}"
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> $GITHUB_ENV

      - name: Build Android Release APK
        continue-on-error: true
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || true

      - name: Prepare APK Outputs
        run: |
          mkdir -p output_apk

          # 1. Locate freshly built Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release .build-outputs -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found freshly built Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
            cp "$RELEASE_APK" "output_apk/JLPT_N3_Burmese_Vocab.apk"
          fi

          # 2. Locate freshly built Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found freshly built Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" "output_apk/KanjiKotoba-${TAG_NAME}-debug.apk"
            # If no release APK was created, debug APK serves as standard install APK
            if [ ! -f "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
              cp "$DEBUG_APK" "output_apk/JLPT_N3_Burmese_Vocab.apk"
              cp "$DEBUG_APK" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
            fi
          fi

          # 3. Fallback to repository APKs if no new APK was built
          if [ ! -f "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "Using production APK from apk/ directory..."
            if [ -f "apk/JLPT_N3_Burmese_Vocab.apk" ]; then
              cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/JLPT_N3_Burmese_Vocab.apk"
              cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
            elif [ -f "apk/KanjiKotoba-v1.1-release.apk" ]; then
              cp "apk/KanjiKotoba-v1.1-release.apk" "output_apk/JLPT_N3_Burmese_Vocab.apk"
              cp "apk/KanjiKotoba-v1.1-release.apk" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
            fi
          fi

          echo "Generated APK files in output_apk/:"
          ls -lh output_apk/
          if [ ! -s "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "Error: No APK file available in output_apk/"
            exit 1
          fi

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KanjiKotoba-APKs-${{ env.TAG_NAME }}
          path: output_apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release & Tag New Version
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          files: output_apk/*.apk
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.is_draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || false }}
          generate_release_notes: true
          body: |
            ### 🇯🇵 JLPT N3 Burmese Vocab & Kanji Sensei (KanjiKotoba)

            **Version Tag:** `${{ env.TAG_NAME }}`  
            **Build Commit:** `${{ github.sha }}`

            ---

            ### 📲 Download APK
            - **Production Release**: `KanjiKotoba-${{ env.TAG_NAME }}-release.apk`
            - **Standard Direct Install**: `JLPT_N3_Burmese_Vocab.apk`
            - **Debug APK**: `KanjiKotoba-${{ env.TAG_NAME }}-debug.apk`

            ---

            ### 🌟 Key Highlights & Features
            - **မေးခွန်းဟောင်းများ (2014-2025 Past Exam Questions)**: 1,357 real JLPT N3 Vocabulary & Kanji questions across 20 exam sessions with exact Myanmar/Burmese translations.
            - **Past Exam Sections**: Dedicated tabs for **Kotoba (語彙)**, **Kanji (漢字)**, and **3D Flashcards (ကတ်ပြား)** with session filters (2014/12 to 2025/12).
            - **Modern Clean Card Design**: Dynamic color accents, real-time drag border glows (Green for Good, Orange for Again, Blue for Flip), and real past exam sentence contexts.
            - **Smart Shuffle System**: 4 study shuffle modes including **Smart SRS Shuffle (မေးခွန်းခက် ဦးစားပေး)**, **Difficult Only Drill**, **Random Shuffle**, and original **Exam Chronological Order**.
            - **Customizable 3D Flashcard Gestures**: 4 interactive gesture modes — **Swipe SRS**, **Slide Carousel**, **Vertical 3D Flip**, and **Tap Only** with camera distance perspective and spring physics.
            - **Daily Quiz Streak Tracking**: Real-time streak tracking calculated from quiz history with a midnight grace period.
            - **Profile Streak Badges**: Prominent flame badge in the profile header with 7-day activity calendar dialog.
            - **Japanese Text-To-Speech (TTS)**: Pronounce Kanji, readings, vocabulary, collocations, and example sentences.
            - **Spaced Repetition (SRS)**: SM-2 spaced repetition algorithm for long-term memory retention.
            - **100% Offline Ready**: All vocabulary, past exams, and Burmese translations stored locally in Room SQLite.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "### 🚀 Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Tag**: \`${{ env.TAG_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APKs generated**: " >> $GITHUB_STEP_SUMMARY
          ls -1 output_apk/*.apk | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
