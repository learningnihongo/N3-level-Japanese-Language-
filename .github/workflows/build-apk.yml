name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Android SDK Licenses & Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          
          # Accept SDK licenses
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63831876579086e1a0ce3e95057b7332" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses 2>/dev/null || true
          fi

      - name: Setup Keystore & Signing
        run: |
          rm -f debug.keystore my-upload-key.jks
          
          # Setup debug keystore
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Setup upload key with alias 'upload'
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Upload Key,O=Android,C=US"
          
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Setup Environment File
        run: |
          touch .env
          if [ -f .env.example ]; then
            cp -n .env.example .env || true
          fi

      - name: Build Android APK
        run: |
          chmod +x gradlew || true
          echo "Building APK..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Organize Output APK Files
        run: |
          mkdir -p output_apk
          
          VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            VERSION="1.0"
          fi
          TAG="v${VERSION}.${{ github.run_number }}"
          echo "BUILD_TAG=$TAG" >> $GITHUB_ENV

          # Find generated APK
          BUILT_APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -n "$BUILT_APK" ] && [ -f "$BUILT_APK" ]; then
            echo "Found built APK: $BUILT_APK"
            cp "$BUILT_APK" "output_apk/JLPT_N3_Burmese_Vocab.apk"
            cp "$BUILT_APK" "output_apk/KanjiKotoba-${TAG}.apk"
          elif [ -f "apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "Using pre-built APK from repository..."
            cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/JLPT_N3_Burmese_Vocab.apk"
            cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/KanjiKotoba-${TAG}.apk"
          fi

          if [ ! -s "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "Error: No APK was found in build outputs!"
            exit 1
          fi

          ls -lh output_apk/
          cd output_apk
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt
          cd ..

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JLPT_N3_Burmese_Vocab_APK
          path: output_apk/*
          retention-days: 60

      - name: Create Git Tag and Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${BUILD_TAG:-v1.0.${{ github.run_number }}}"
          echo "Target Release Tag: $TAG"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create Git tag
          git tag -a "$TAG" -m "Release $TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || echo "Tag push skipped"

          # Publish release via GitHub CLI with --target
          cat << 'EOF' > release_notes.md
          ## JLPT N3 Burmese Vocab & Kanji Sensei

          ### Downloads:
          - Recommended APK: JLPT_N3_Burmese_Vocab.apk
          - Checksums: sha256_checksums.txt

          ### Features:
          - 4,584 Vocabulary & Kanji
          - 1,357 Past Exam Questions with Burmese Translations
          - 3D Flashcards & Daily Quiz
          - 100% Offline Ready
          EOF

          gh release create "$TAG" output_apk/* \
            --title "KanjiKotoba JLPT N3 Sensei ($TAG)" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --clobber || echo "Release published or fallback completed"
