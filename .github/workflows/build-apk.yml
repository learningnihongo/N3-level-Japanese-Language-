name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Name (e.g. v1.2.0, or leave blank to auto-tag)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release Title (leave blank for auto-generated title)'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: true
      is_draft:
        description: 'Create as Draft Release'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63831876579086e1a0ce3e95057b7332" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

      - name: Setup Keystore & Signing Environment
        run: |
          rm -f debug.keystore my-upload-key.jks
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating fresh valid debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          cp -f debug.keystore my-upload-key.jks 2>/dev/null || true
          ls -la debug.keystore
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/debug.keystore" >> $GITHUB_ENV
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Prepare Secrets & Environment Configuration
        run: |
          touch .env
          if [ -f .env.example ]; then
            cp -n .env.example .env || true
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Calculate Version and Tag Name
        id: versioning
        run: |
          BASE_VERSION=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.0"
          fi
          echo "Base Version: $BASE_VERSION"

          SHOULD_RELEASE="false"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            SHOULD_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [ -n "${{ inputs.release_tag }}" ]; then
              TAG_NAME="${{ inputs.release_tag }}"
            else
              TAG_NAME="v${BASE_VERSION}.${{ github.run_number }}"
            fi
            if [ "${{ inputs.create_release }}" == "true" ]; then
              SHOULD_RELEASE="true"
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            TAG_NAME="v${BASE_VERSION}.${{ github.run_number }}"
            SHOULD_RELEASE="true"
          else
            TAG_NAME="v${BASE_VERSION}-dev.${{ github.run_number }}"
            SHOULD_RELEASE="false"
          fi

          if [ -n "${{ inputs.release_title }}" ]; then
            RELEASE_TITLE="${{ inputs.release_title }}"
          else
            RELEASE_TITLE="KanjiKotoba JLPT N3 Sensei ${TAG_NAME}"
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> $GITHUB_ENV

      - name: Build Android APK (Release & Debug)
        run: |
          echo "Running Gradle build..."
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Organize Output APK Files
        id: organize_apks
        run: |
          mkdir -p output_apk

          # Locate built APKs
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | head -n 1)

          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
            cp "$RELEASE_APK" "output_apk/JLPT_N3_Burmese_Vocab.apk"
          fi

          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" "output_apk/KanjiKotoba-${TAG_NAME}-debug.apk"
            if [ ! -f "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
              cp "$DEBUG_APK" "output_apk/JLPT_N3_Burmese_Vocab.apk"
              cp "$DEBUG_APK" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
            fi
          fi

          # Fallback to pre-built apk if needed
          if [ ! -f "output_apk/JLPT_N3_Burmese_Vocab.apk" ] && [ -f "apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "Falling back to repository APK..."
            cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/JLPT_N3_Burmese_Vocab.apk"
            cp "apk/JLPT_N3_Burmese_Vocab.apk" "output_apk/KanjiKotoba-${TAG_NAME}-release.apk"
          fi

          echo "Output APK list:"
          ls -lh output_apk/
          if [ ! -s "output_apk/JLPT_N3_Burmese_Vocab.apk" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi

          # Generate SHA256 Checksums
          cd output_apk
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt
          cd ..

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KanjiKotoba-APKs-${{ env.TAG_NAME }}
          path: output_apk/*
          retention-days: 60
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          files: output_apk/*
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.is_draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || false }}
          generate_release_notes: true
          body: |
            ## 🇯🇵 JLPT N3 Burmese Vocab & Kanji Sensei (KanjiKotoba)

            **Release Version:** `${{ env.TAG_NAME }}`
            **Commit:** `${{ github.sha }}`

            ---

            ### 📲 Downloads
            * **Recommended (Direct Install):** `JLPT_N3_Burmese_Vocab.apk`
            * **Production Release:** `KanjiKotoba-${{ env.TAG_NAME }}-release.apk`
            * **Debug APK:** `KanjiKotoba-${{ env.TAG_NAME }}-debug.apk`
            * **Checksums:** `sha256_checksums.txt`

            ---

            ### ✨ အဓိက ပါဝင်သော အချက်များ (Key Features)
            * **ဝေါဟာရ ၄,၅၈၄ ခု အပြည့်အစုံ:** JLPT N3 စာမေးပွဲအတွက် လိုအပ်သော Kanji, Kotoba, အဓိပ္ပာယ် နှင့် အသံထွက် ၄,၅၈၄ ခု အားလုံး ပါဝင်ပါသည်။
            * **စစ်မှန်သော မေးခွန်းဟောင်းများ (2014-2025):** ၁,၃၅၇ ခုသော မေးခွန်းဟောင်းများကို မြန်မာဘာသာပြန်နှင့်တကွ လေ့ကျင့်နိုင်ပါသည်။
            * **3D Flashcards & Interactive Gestures:** Flip, Swipe, နှင့် Smooth Carousel အမူအရာများဖြင့် လေ့လာနိုင်ပါသည်။
            * **Daily Quiz & Streak Tracking:** နေ့စဉ် Quiz လေ့ကျင့်မှုနှင့် Streak စနစ် ပါဝင်ပါသည်။
            * **100% Offline Ready:** အင်တာနက်မလိုဘဲ ဖုန်းထဲတွင် တိုက်ရိုက် လေ့လာမှတ်သားနိုင်ပါသည်။
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary Output
        run: |
          echo "## 🚀 Build & Release Successful!" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: \`${{ env.TAG_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "### Generated APKs:" >> $GITHUB_STEP_SUMMARY
          ls -lh output_apk/*.apk | awk '{print "- **" $9 "** (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
